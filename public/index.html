<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faisal AI</title><style>body{font:15px system-ui;margin:auto;max-width:1100px;background:#07151c;color:#e8f1f3;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#7de2c5}section{background:#10262e;padding:18px;border-radius:12px;margin:16px 0}textarea,input{width:100%;box-sizing:border-box;margin:5px 0;padding:9px;background:#07151c;color:white;border:1px solid #39606a;border-radius:6px}button,a.btn{background:#7de2c5;color:#062027;border:0;padding:9px 12px;border-radius:6px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}small{color:#a7c1c6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{border:1px solid #31515a;border-radius:8px;padding:12px;margin:8px 0}pre{white-space:pre-wrap;font:inherit}.pending{color:#ffd479}</style><body><header><div><h1>Faisal AI</h1><small>Personal career intelligence · human approval required for outreach/applications</small></div><a class="btn" href="/auth/google">Connect Gmail (read-only)</a></header><main id="app">Loading…</main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(url,opt){let r=await fetch(url,{headers:{'content-type':'application/json'},...opt}),x=await r.json();if(!r.ok)throw Error(x.error);return x}let state;
async function render(){state=await api('/api/state');let p=state.profile;$('#app').innerHTML=`<div class="grid"><section><h2>Profile (editable)</h2><input id="name" value="${esc(p.name)}" placeholder="Name"><input id="headline" value="${esc(p.headline)}" placeholder="Headline"><textarea id="summary">${esc(p.summary)}</textarea><input id="skills" value="${esc(p.skills.join(', '))}" placeholder="Skills, comma-separated"><input id="targets" value="${esc(p.targets.join(', '))}" placeholder="Target roles"><input id="locations" value="${esc(p.locations.join(', '))}" placeholder="Locations"><input id="portfolio" value="${esc(p.portfolioUrl)}" placeholder="Portfolio URL"><button onclick="saveProfile()">Save profile</button></section><section><h2>Career inbox</h2><p>${state.oauth.google?'Gmail connected (read-only).':'No mailbox connected.'}</p><button onclick="email()">Analyze recent career emails</button><pre id="email"></pre><h3>Daily report</h3><p>Production schedules combine jobs, approval states, and email summaries. This MVP exposes the reviewed inputs and audit trail.</p></section></div><section><h2>Job discovery & matching</h2>${state.jobs.map(j=>`<div class="card"><b>${esc(j.title)}</b> · ${esc(j.company)}<br><small>${esc(j.location)} · ${esc(j.source)}</small><br><a href="${esc(j.url)}" target="_blank">Open original listing</a><button onclick="analyze('${j.id}')">Analyze match</button><pre id="a-${j.id}"></pre></div>`).join('')}</section><div class="grid"><section><h2>CV versioning</h2><input id="cvlabel" placeholder="Version label"><textarea id="cvcontent">${esc(p.cvText)}</textarea><button onclick="cv()">Save version</button>${state.cvVersions.slice(0,5).map(v=>`<div class="card"><b>${esc(v.label)}</b><br><small>${v.createdAt}</small></div>`).join('')}</section><section><h2>Networking CRM</h2><input id="contactname" placeholder="Name"><input id="contactcompany" placeholder="Company / role"><textarea id="contactnote" placeholder="Relationship notes / manual LinkedIn link"></textarea><button onclick="contact()">Add contact</button>${state.contacts.slice(0,5).map(c=>`<div class="card"><b>${esc(c.name)}</b> · ${esc(c.company||'')}<br>${esc(c.note||'')}</div>`).join('')}</section></div><section><h2>Approval queue</h2><p>Drafts are never sent by Faisal AI. Approve then copy/send yourself through the destination platform.</p><input id="drafttitle" placeholder="Draft title"><textarea id="draftbody" placeholder="Paste a message/application draft"></textarea><input id="draftdest" placeholder="Destination URL or platform"><button onclick="queue()">Queue for review</button>${state.approvals.map(a=>`<div class="card"><b class="${a.status==='pending'?'pending':''}">${esc(a.status.toUpperCase())}</b> · ${esc(a.title)}<br>${esc(a.body)}<br>${a.status==='pending'?`<button onclick="decide('${a.id}','approved')">Approve</button><button onclick="decide('${a.id}','rejected')">Reject</button>`:''}</div>`).join('')}</section><section><h2>Audit log</h2>${state.audit.slice(0,10).map(a=>`<small>${a.at} — ${esc(a.action)}</small><br>`).join('')}</section>`}
async function saveProfile(){await api('/api/profile',{method:'POST',body:JSON.stringify({name:$('#name').value,headline:$('#headline').value,summary:$('#summary').value,skills:$('#skills').value.split(',').map(x=>x.trim()).filter(Boolean),targets:$('#targets').value.split(',').map(x=>x.trim()).filter(Boolean),locations:$('#locations').value.split(',').map(x=>x.trim()).filter(Boolean),portfolioUrl:$('#portfolio').value})});render()}async function analyze(id){let e=$('#a-'+id);e.textContent='Analyzing…';try{let x=await api('/api/analyze',{method:'POST',body:JSON.stringify({jobId:id})});e.textContent=`${x.score}/100 · ${x.provider}\n${x.analysis}`}catch(x){e.textContent=x.message}}async function cv(){await api('/api/cv',{method:'POST',body:JSON.stringify({label:$('#cvlabel').value,content:$('#cvcontent').value})});render()}async function contact(){await api('/api/contact',{method:'POST',body:JSON.stringify({name:$('#contactname').value,company:$('#contactcompany').value,note:$('#contactnote').value})});render()}async function queue(){await api('/api/approval',{method:'POST',body:JSON.stringify({title:$('#drafttitle').value,body:$('#draftbody').value,destination:$('#draftdest').value})});render()}async function decide(id,status){await api('/api/approval/'+id,{method:'POST',body:JSON.stringify({status})});render()}async function email(){let e=$('#email');e.textContent='Checking…';try{e.textContent=JSON.stringify(await api('/api/email/summary'),null,2)}catch(x){e.textContent=x.message}}render();
</script><script src="/extra.js"></script></body></html>
